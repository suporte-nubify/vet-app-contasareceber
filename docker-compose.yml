services:
  app:
    build: .
    container_name: vet-app
    # sem "ports": o NPM acessa direto pela rede NubDocker
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      NEXTAUTH_URL: "https://contas.seudominio.com.br"
      NEXTAUTH_SECRET: "*^%sZ^u!!DetW35RWXQJEUu&N1DCa@"
    volumes:
      - ./data:/app/data
    networks:
      - NubDocker
    restart: unless-stopped

networks:
  NubDocker:
    external: true
